name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Render TestShort
        run: npx remotion render TestShort out/video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4

      - name: Render Episode4
        run: npx remotion render Episode4 out/episode4.mp4 --codec=h264 --crf=18 --audio-codec=aac --audio-bitrate=320k

      - name: Upload episode4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: episode4
          path: out/episode4.mp4
