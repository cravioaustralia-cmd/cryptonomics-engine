name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render TestShort
        run: npx remotion render TestShort out/video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
