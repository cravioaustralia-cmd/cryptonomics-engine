<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Chapter 5</title>
<style>
  @font-face { font-family: "Playfair Display"; src: url("/style/fonts/playfair-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Playfair Display"; src: url("/style/fonts/playfair-display-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Source Sans 3"; src: url("/style/fonts/source-sans-3-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Source Sans 3"; src: url("/style/fonts/source-sans-3-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  html, body { margin: 0; padding: 0; background: #000; }
  svg { display: block; }
  .cam { transform-origin: 50% 50%; }
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs"></defs>
  <g id="root"></g>
</svg>

<script type="module">
import { PALETTE, FONTS, ease, progress, fadeIn, styleDefsSVG, vignetteOverlayRect,
         warmGradeOverlayRect, pushPan, chapterTitleCardSVG, pictureLayerSVG,
         buildCaptionLines, findActiveCaption, captionBarSVG, escapeXML } from "/style/style.js";
import { blighSVG, bicorneHatSVG, soldierSilhouetteSVG, legPhase } from "/style/characters.js";

const W = 1920, FRAME_H = 1080;
const defsEl = document.getElementById("defs");
const rootEl = document.getElementById("root");
defsEl.innerHTML = styleDefsSVG();

let captionLines = null;

// Chapter 5 local time 0 = global transcript time 345.48s ("Remember that
// governor...") through 424.03s ("...it comes back."), per transcript.json
// (words 843-1029).
const GLOBAL_OFFSET = 345.48;
const BEAT = {
  title: 0.0,
  blighReveal: 2.5,
  mutinyGag: 351.09 - GLOBAL_OFFSET,     // 5.61  "Yes, that Bligh..."
  rebellionGag: 358.72 - GLOBAL_OFFSET,  // 13.24 "So Britain made him governor..."
  arrestCartoon: 366.23 - GLOBAL_OFFSET, // 20.75 "It's called the Rum Rebellion..."
  rumBarrels: 367.87 - GLOBAL_OFFSET,    // 22.39 "because the military officers..."
  zeroForTwoSting: 379.08 - GLOBAL_OFFSET, // 33.60 "Bligh, zero for two."
  macquarie: 380.31 - GLOBAL_OFFSET,     // 34.83 "Things steadied..."
  blueMountains: 386.14 - GLOBAL_OFFSET, // 40.66 "In 1813, explorers..."
  myallCreek: 393.89 - GLOBAL_OFFSET,    // 48.41 "That expansion came with violence..."
  terraNullius: 414.43 - GLOBAL_OFFSET,  // 68.95 "Britain treated the land..."
  end: 424.03 - GLOBAL_OFFSET + 0.5,     // 79.05
};

async function ensureAssets() {
  const res = await fetch("/transcript.json");
  const data = await res.json();
  // Chapter 5's words: index 843 ("Remember") through 1029 ("back"), inclusive.
  const chapterWords = data.words.slice(843, 1030).map((w) => ({
    text: w.text,
    start: w.start - GLOBAL_OFFSET,
    end: w.end - GLOBAL_OFFSET,
  }));
  captionLines = buildCaptionLines(chapterWords, { maxWords: 7 });
}

function pictureBeatSVG({ href, imgW, imgH, t, start, duration, label, camFrom = 1.0, camTo = 1.14, panFromX = 0, panToX = 0, panFromY = 0, panToY = 0 }) {
  const cam = pushPan(t, { start, duration, from: camFrom, to: camTo, fromX: panFromX, toX: panToX, fromY: panFromY, toY: panToY });
  let out = `
    <g class="cam" style="transform:${cam}">
      ${pictureLayerSVG({ href, imgW, imgH, frameW: W, frameH: FRAME_H })}
    </g>
    ${warmGradeOverlayRect(W, FRAME_H)}
    ${vignetteOverlayRect(W, FRAME_H)}
    <rect x="0" y="0" width="${W}" height="${FRAME_H}" filter="url(#filmGrain)" opacity="0.38"/>
  `;
  if (label) {
    const p = fadeIn(t, start + 0.35, 0.6);
    out += `<text x="50%" y="100" text-anchor="middle" font-family="${FONTS.sans}" font-size="22" letter-spacing="3"
      fill="${PALETTE.cream}" opacity="${p.toFixed(3)}">${escapeXML(label)}</text>`;
  }
  return out;
}

// ---- Bligh: zero for two — flat-2D comedy beats ----
const RAIL_Y = 520;

function shipMastSVG(x, baseY, sway) {
  return `
    <g transform="translate(${x},${baseY}) rotate(${sway})">
      <rect x="-4" y="-420" width="8" height="420" fill="#241a12"/>
      <path d="M -95 -360 L 95 -360 L 92 -350 L -92 -350 Z" fill="#241a12"/>
      <path d="M 4 -410 L 100 -370 L 4 -350 Z" fill="#382a1c" opacity="0.9"/>
      <path d="M -95 -358 L 0 -240 M 95 -358 L 0 -240" stroke="#241a12" stroke-width="2.5" opacity="0.8"/>
    </g>
  `;
}

// shakeXY - a short, decaying high-frequency jolt for impact moments.
function shakeXY(t, triggerT, duration = 0.35, magnitude = 10) {
  const p = progress(t, triggerT, duration, ease.linear);
  if (p <= 0 || p >= 1) return "0,0";
  const decay = 1 - p;
  return `${(Math.sin(t * 47) * magnitude * decay).toFixed(1)},${(Math.cos(t * 61) * magnitude * 0.6 * decay).toFixed(1)}`;
}

function gullsSVG(t, topY, count = 3) {
  let out = "";
  for (let i = 0; i < count; i++) {
    const speed = 55 + i * 18;
    const y = topY + i * 26 + Math.sin(t * 1.5 + i) * 5;
    const x = ((t * speed + i * 340) % (W + 200)) - 100;
    out += `<path d="M ${(x - 11).toFixed(1)} ${y.toFixed(1)} Q ${x.toFixed(1)} ${(y - 9).toFixed(1)} ${(x + 11).toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${PALETTE.sandstoneLight}" stroke-width="2" opacity="0.45"/>`;
  }
  return out;
}

function oceanSceneSVG(t) {
  let out = `
    <linearGradient id="blighSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${PALETTE.outbackNightIndigo}"/>
      <stop offset="100%" stop-color="${PALETTE.redOchreDeep}"/>
    </linearGradient>
    <rect x="0" y="0" width="${W}" height="${RAIL_Y}" fill="url(#blighSky)"/>
    <rect x="0" y="${RAIL_Y}" width="${W}" height="${FRAME_H - RAIL_Y}" fill="${PALETTE.outbackNightIndigoDeep}"/>
  `;
  out += gullsSVG(t, 90, 3);
  const sway = Math.sin(t * 0.8) * 1.3;
  out += shipMastSVG(1640, RAIL_Y + 4, sway);
  for (let i = 0; i < 6; i++) {
    const wy = RAIL_Y + 40 + i * 70;
    const offset = Math.sin(t * 0.8 + i * 1.3) * 18;
    out += `<path d="M ${-20 + offset} ${wy} Q ${W / 2} ${wy - 14} ${W + 20 + offset} ${wy}" stroke="${PALETTE.sandstone}" stroke-width="1.5" opacity="0.18" fill="none"/>`;
  }
  out += `<rect x="0" y="${RAIL_Y - 14}" width="${W}" height="14" fill="#4a3320"/>`;
  return out;
}

// splashBurstSVG - an expanding ring plus a dozen droplets on real
// (deterministic) parabolic arcs, for a much punchier "he's overboard" hit
// than a few fading circles.
const DROPLET_ANGLES = [-100, -75, -55, -25, 25, 55, 75, 100];

function splashBurstSVG(x, y, t, start, duration = 0.9) {
  const localT = t - start;
  if (localT < 0 || localT > duration) return "";
  const p = localT / duration;
  const r = 10 + p * 110;
  let out = `<circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="none" stroke="${PALETTE.cream}" stroke-width="${(5 * (1 - p)).toFixed(1)}" opacity="${(1 - p).toFixed(2)}"/>`;
  for (const a of DROPLET_ANGLES) {
    const rad = (a * Math.PI) / 180;
    const speed = 260;
    const dx = Math.sin(rad) * speed * localT;
    const dy = -Math.cos(rad) * speed * localT + 620 * localT * localT;
    const op = Math.max(0, 1 - p * 1.2);
    out += `<circle cx="${(x + dx).toFixed(1)}" cy="${(y + dy).toFixed(1)}" r="3.5" fill="${PALETTE.cream}" opacity="${op.toFixed(2)}"/>`;
  }
  return out;
}

function rippleSVG(x, y, t, start, duration = 1.0) {
  const p = progress(t, start, duration, ease.outCubic);
  if (p <= 0 || p >= 1) return "";
  const r = 20 + p * 90;
  return `<ellipse cx="${x}" cy="${y}" rx="${r.toFixed(1)}" ry="${(r * 0.28).toFixed(1)}" fill="none" stroke="${PALETTE.cream}" stroke-width="2" opacity="${(0.5 * (1 - p)).toFixed(2)}"/>`;
}

function governmentHouseSVG() {
  return `
    <rect x="560" y="440" width="800" height="280" fill="#2a2038"/>
    <path d="M 540 440 L 960 320 L 1380 440 Z" fill="#221a2e"/>
    ${[0, 1, 2, 3, 4, 5].map((i) => `<rect x="${600 + i * 130}" y="460" width="30" height="240" fill="#382c48"/>`).join("")}
    <rect x="0" y="700" width="${W}" height="${FRAME_H - 700}" fill="${PALETTE.redOchreDeep}" opacity="0.5"/>
  `;
}

function dustPuffSVG(x, y, t, phase) {
  const cyclePos = ((t * 6 + phase) % (Math.PI * 2)) / (Math.PI * 2);
  if (cyclePos > 0.35) return "";
  const p = cyclePos / 0.35;
  const r = 4 + p * 16;
  return `<ellipse cx="${x}" cy="${y}" rx="${r.toFixed(1)}" ry="${(r * 0.4).toFixed(1)}" fill="${PALETTE.sandstone}" opacity="${(0.35 * (1 - p)).toFixed(2)}"/>`;
}

// scoreCornerSVG - the running "mutinies against Bligh" tally. Each mark
// pops in with an outBack bounce at the moment it happened, instead of the
// whole cluster just appearing.
function scoreCornerSVG(t, marksAppearAt) {
  const visible = marksAppearAt.filter((mt) => t >= mt);
  if (visible.length === 0) return "";
  const labelP = fadeIn(t, marksAppearAt[0], 0.3);
  let out = `<g opacity="${labelP.toFixed(3)}">
    <text x="${W - 60}" y="70" text-anchor="end" font-family="${FONTS.sans}" font-size="18" letter-spacing="2"
      fill="${PALETTE.sandstoneLight}">MUTINIES AGAINST BLIGH</text>`;
  visible.forEach((mt, i) => {
    const bounce = progress(t, mt, 0.45, ease.outBack);
    out += `<g transform="translate(${W - 60 - i * 36},100) scale(${bounce.toFixed(3)})">
      <circle r="12" fill="none" stroke="${PALETTE.sunsetOrange}" stroke-width="2.5"/>
      <path d="M -7 -7 L 7 7 M 7 -7 L -7 7" stroke="${PALETTE.sunsetOrange}" stroke-width="2.5"/>
    </g>`;
  });
  return out + `</g>`;
}

function mutinyGagSVG(t) {
  const start = BEAT.mutinyGag;
  const camScale = 1.02 + progress(t, start, 6.5, ease.linear) * 0.24;
  const [shakeX, shakeY] = shakeXY(t, start + 3.35, 0.4, 16).split(",");
  let out = `<g class="cam" style="transform: translate(${shakeX}px,${shakeY}px) scale(${camScale.toFixed(3)})">`;
  out += oceanSceneSVG(t);

  // Crew: anticipation (wind up) then a fast forward push-swing.
  const windUpP = progress(t, start + 0.4, 0.8, ease.outCubic);
  const swingP = progress(t, start + 1.2, 0.5, ease.inCubic);
  const settleAngle = 46; // where their arms rest once he's overboard, leaning on the rail
  const armSwing = -30 - windUpP * 25 + swingP * (settleAngle + 30 - 25);
  const crewIdle = Math.sin(t * 2.2) * 4;
  out += soldierSilhouetteSVG({ x: 700, y: RAIL_Y + 20, scale: 2.5, armAngle: armSwing + crewIdle, legAngle: 4, color: "#3a4a5c" });
  out += soldierSilhouetteSVG({ x: 1240, y: RAIL_Y + 20, scale: 2.5, armAngle: -armSwing - crewIdle, legAngle: -4, color: "#3a4a5c" });

  // Bligh: tipped backward over the rail in an arc, flailing, hat flying
  // off separately — then gone once he's under.
  const tipP = progress(t, start + 1.6, 1.15, ease.inCubic);
  const rotate = -tipP * 260;
  const arcX = 970 + Math.sin(tipP * 1.2) * 55;
  const arcY = RAIL_Y + 20 - Math.sin(tipP * Math.PI) * 130;
  const blighOpacity = 1 - progress(t, start + 2.75, 0.35, ease.linear);
  if (blighOpacity > 0) {
    out += `<g opacity="${blighOpacity.toFixed(3)}">
      ${blighSVG({
        x: arcX, y: arcY, scale: 2.9, rotate,
        armAngleL: -20 - tipP * 90 + Math.sin(t * 22) * 20,
        armAngleR: -20 - tipP * 70 - Math.sin(t * 19) * 20,
        legAngle: tipP * 30,
        hatOn: false,
      })}
    </g>`;
    if (tipP > 0.55) out += `<path d="M ${arcX - 55} ${arcY} L ${arcX - 8} ${arcY}" stroke="${PALETTE.cream}" stroke-width="2.5" opacity="${(blighOpacity * 0.4).toFixed(2)}"/>`;
  }
  const hatP = progress(t, start + 1.75, 1.3, ease.linear);
  if (hatP > 0 && hatP < 1) {
    const hatX = 970 + hatP * 190;
    const hatY = RAIL_Y - 40 + 620 * hatP * hatP - 160 * hatP;
    out += bicorneHatSVG({ x: hatX, y: hatY, scale: 2.2, rotate: hatP * 480 });
  }

  out += splashBurstSVG(970, RAIL_Y + 50, t, start + 2.6, 0.9);
  out += rippleSVG(970, RAIL_Y + 54, t, start + 3.4, 1.1);
  out += rippleSVG(970, RAIL_Y + 54, t, start + 4.3, 1.1);

  out += `</g>`; // .cam

  const titleP = fadeIn(t, start + 0.2, 0.5);
  out += `<text x="50%" y="90" text-anchor="middle" font-family="${FONTS.serif}" font-size="34"
    fill="${PALETTE.cream}" opacity="${titleP.toFixed(3)}">Mutiny on the Bounty · 1789</text>`;
  out += scoreCornerSVG(t, [start + 3.1]);

  return out + warmGradeOverlayRect(W, FRAME_H) + vignetteOverlayRect(W, FRAME_H) +
    `<rect x="0" y="0" width="${W}" height="${FRAME_H}" filter="url(#filmGrain)" opacity="0.35"/>`;
}

function rebellionGagSVG(t) {
  const start = BEAT.rebellionGag;
  const camScale = 1.0 + progress(t, start, 6.5, ease.linear) * 0.2;
  const arriveShake = shakeXY(t, start + 1.95, 0.3, 12).split(",");
  let out = `<g class="cam" style="transform: translate(${arriveShake[0]}px,${arriveShake[1]}px) scale(${camScale.toFixed(3)})">`;
  out += `<rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.outbackNightIndigoDeep}"/>`;
  out += governmentHouseSVG();

  const marchP = progress(t, start + 0.3, 1.6, ease.outCubic);
  const marching = marchP > 0 && marchP < 1;
  const stepPhase = t * 9;
  const soldier1X = 200 + (830 - 200) * marchP;
  const soldier2X = 1720 + (1090 - 1720) * marchP;
  const bob = marching ? Math.abs(Math.sin(stepPhase)) * 8 : 0;
  const legSwing = marching ? legPhase(t, 9) * 22 : 0;

  if (marching) {
    out += dustPuffSVG(soldier1X - 26, 726, t, 0);
    out += dustPuffSVG(soldier2X + 26, 726, t, Math.PI);
  }
  out += soldierSilhouetteSVG({ x: soldier1X, y: 720 - bob, scale: 2.6, armAngle: -10 + legSwing * 0.4, legAngle: legSwing, color: "#7a2f2f" });
  out += soldierSilhouetteSVG({ x: soldier2X, y: 720 - bob, scale: 2.6, armAngle: 10 - legSwing * 0.4, legAngle: -legSwing, color: "#7a2f2f" });
  // A second rank, smaller and further back, for a "detachment" feel.
  out += soldierSilhouetteSVG({ x: soldier1X - 80, y: 660 - bob * 0.6, scale: 1.7, armAngle: -8, legAngle: legSwing * 0.7, color: "#5c2323" });
  out += soldierSilhouetteSVG({ x: soldier2X + 80, y: 660 - bob * 0.6, scale: 1.7, armAngle: 8, legAngle: -legSwing * 0.7, color: "#5c2323" });

  // Bligh: a quick startled recoil, then hands-up surrender with an
  // overshoot bounce.
  const recoilP = progress(t, start + 1.7, 0.4, ease.outCubic);
  const surrenderP = progress(t, start + 2.1, 0.7, ease.outBack);
  const leanX = -recoilP * 18 * (1 - surrenderP);
  const armL = -20 - recoilP * 40 - surrenderP * 90;
  const armR = -20 - recoilP * 10 - surrenderP * 120;
  out += blighSVG({ x: 960 + leanX, y: 720, scale: 2.9, armAngleL: armL, armAngleR: armR, rotate: -recoilP * 6 * (1 - surrenderP) });

  out += `</g>`; // .cam

  const titleP = fadeIn(t, start + 0.2, 0.5);
  out += `<text x="50%" y="90" text-anchor="middle" font-family="${FONTS.serif}" font-size="34"
    fill="${PALETTE.cream}" opacity="${titleP.toFixed(3)}">The Rum Rebellion · 1808</text>`;
  out += scoreCornerSVG(t, [BEAT.mutinyGag + 3.1, start + 2.8]);

  return out + warmGradeOverlayRect(W, FRAME_H) + vignetteOverlayRect(W, FRAME_H) +
    `<rect x="0" y="0" width="${W}" height="${FRAME_H}" filter="url(#filmGrain)" opacity="0.35"/>`;
}

function zeroForTwoStingSVG(t) {
  const start = BEAT.zeroForTwoSting;
  const flashP = progress(t, start, 0.3, ease.linear);
  const [shakeX, shakeY] = shakeXY(t, start, 0.3, 12).split(",");
  const p1 = progress(t, start, 0.3, ease.outBack);
  const p2 = progress(t, start + 0.12, 0.35, ease.outBack);
  let out = `<rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.outbackNightIndigoDeep}"/>`;
  out += `<g style="transform: translate(${shakeX}px,${shakeY}px)">
    <g transform="translate(960,510) scale(${p1.toFixed(3)})">
      <text x="0" y="-10" text-anchor="middle" font-family="${FONTS.serif}" font-weight="700" font-size="80" fill="${PALETTE.cream}">BLIGH</text>
    </g>
    <g transform="translate(960,600) scale(${p2.toFixed(3)})">
      <text x="0" y="80" text-anchor="middle" font-family="${FONTS.serif}" font-weight="700" font-size="92" fill="${PALETTE.sunsetOrange}">ZERO FOR TWO</text>
    </g>
  </g>`;
  out += `<rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.cream}" opacity="${(Math.max(0, 1 - flashP * 5)).toFixed(2)}"/>`;
  return out + warmGradeOverlayRect(W, FRAME_H) + vignetteOverlayRect(W, FRAME_H);
}

function renderFrame(tLocal) {
  let svg = "";
  if (tLocal < BEAT.blighReveal) {
    svg = chapterTitleCardSVG({
      w: W, h: FRAME_H, t: tLocal, start: BEAT.title,
      chapterLabel: "Chapter Five",
      title: "Mutiny, Rum, and a Very Unlucky Man",
    });
  } else if (tLocal < BEAT.mutinyGag) {
    svg = pictureBeatSVG({
      href: "/images/39_bligh_portrait_2.jpg", imgW: 1086, imgH: 1440,
      t: tLocal, start: BEAT.blighReveal, duration: BEAT.mutinyGag - BEAT.blighReveal,
      camFrom: 1.0, camTo: 1.1,
      label: "WILLIAM BLIGH",
    });
  } else if (tLocal < BEAT.rebellionGag) {
    svg = mutinyGagSVG(tLocal);
  } else if (tLocal < BEAT.arrestCartoon) {
    svg = rebellionGagSVG(tLocal);
  } else if (tLocal < BEAT.rumBarrels) {
    svg = pictureBeatSVG({
      href: "/images/41_bligh_arrest_cartoon.jpg", imgW: 1920, imgH: 1184,
      t: tLocal, start: BEAT.arrestCartoon, duration: BEAT.rumBarrels - BEAT.arrestCartoon,
      camFrom: 1.0, camTo: 1.06,
      label: "CONTEMPORARY CARTOON, 1808",
    });
  } else if (tLocal < BEAT.zeroForTwoSting) {
    svg = pictureBeatSVG({
      href: "/images/42_rum_barrels.jpg", imgW: 1280, imgH: 853,
      t: tLocal, start: BEAT.rumBarrels, duration: BEAT.zeroForTwoSting - BEAT.rumBarrels,
      camFrom: 1.0, camTo: 1.12,
      label: "THE RUM REBELLION",
    });
  } else if (tLocal < BEAT.macquarie) {
    svg = zeroForTwoStingSVG(tLocal);
  } else if (tLocal < BEAT.blueMountains) {
    svg = pictureBeatSVG({
      href: "/images/43_lachlan_macquarie.jpg", imgW: 1189, imgH: 1440,
      t: tLocal, start: BEAT.macquarie, duration: BEAT.blueMountains - BEAT.macquarie,
      camFrom: 1.0, camTo: 1.08,
      label: "GOVERNOR LACHLAN MACQUARIE",
    });
  } else if (tLocal < BEAT.myallCreek) {
    svg = pictureBeatSVG({
      href: "/images/44_three_sisters.jpg", imgW: 1543, imgH: 1600,
      t: tLocal, start: BEAT.blueMountains, duration: BEAT.myallCreek - BEAT.blueMountains,
      camFrom: 1.0, camTo: 1.1,
      label: "BLUE MOUNTAINS · 1813",
    });
  } else if (tLocal < BEAT.terraNullius) {
    svg = pictureBeatSVG({
      href: "/images/45_myall_creek_memorial.jpg", imgW: 1920, imgH: 1440,
      t: tLocal, start: BEAT.myallCreek, duration: BEAT.terraNullius - BEAT.myallCreek,
      camFrom: 1.0, camTo: 1.06,
      label: "MYALL CREEK MEMORIAL",
    });
  } else {
    svg = pictureBeatSVG({
      href: "/images/06_outback_red_desert.jpg", imgW: 2175, imgH: 1461,
      t: tLocal, start: BEAT.terraNullius, duration: BEAT.end - BEAT.terraNullius,
      camFrom: 1.0, camTo: 1.1, panFromX: 0, panToX: -10,
      label: "TERRA NULLIUS",
    });
  }

  if (captionLines) {
    const line = findActiveCaption(captionLines, tLocal);
    if (line) svg += captionBarSVG({ w: W, h: FRAME_H, text: line.text });
  }

  rootEl.innerHTML = svg;
}

window.__ready = ensureAssets();
window.__renderFrame = renderFrame;
window.__END_TIME = BEAT.end;
renderFrame(0);
</script>
</body>
</html>
