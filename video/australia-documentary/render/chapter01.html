<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Chapter 1</title>
<style>
  @font-face { font-family: "Playfair Display"; src: url("/style/fonts/playfair-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Playfair Display"; src: url("/style/fonts/playfair-display-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Source Sans 3"; src: url("/style/fonts/source-sans-3-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Source Sans 3"; src: url("/style/fonts/source-sans-3-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  html, body { margin: 0; padding: 0; background: #000; }
  svg { display: block; }
  .cam { transform-origin: 50% 50%; }
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs"></defs>
  <g id="root"></g>
</svg>

<script type="module">
import { PALETTE, FONTS, ease, progress, fadeIn, clamp01, styleDefsSVG, vignetteOverlayRect,
         warmGradeOverlayRect, pushPan, pushIn, chapterTitleCardSVG, pictureLayerSVG,
         buildCaptionLines, findActiveCaption, captionBarSVG, escapeXML } from "/style/style.js";
import { megalaniaSVG } from "/style/characters.js";

const W = 1920, FRAME_H = 1080;
const defsEl = document.getElementById("defs");
const rootEl = document.getElementById("root");
defsEl.innerHTML = styleDefsSVG();

let captionLines = null;

// Chapter 1 local time 0 = global transcript time 41.13s ("First, the stage.")
// through 88.94s ("...people had arrived."), per transcript.json.
const GLOBAL_OFFSET = 41.13;
const BEAT = {
  title: 0.0,
  gondwana: 2.5,           // "Australia was once part of a supercontinent..."
  diprotodon: 54.87 - GLOBAL_OFFSET,   // 13.74
  procoptodon: 59.04 - GLOBAL_OFFSET,  // 17.91
  megalania: 64.26 - GLOBAL_OFFSET,    // 23.13
  spiderJoke: 72.8 - GLOBAL_OFFSET,    // 31.67 ("Honestly, today's spiders...")
  fossil: 76.16 - GLOBAL_OFFSET,       // 35.03
  end: 88.94 - GLOBAL_OFFSET + 0.4,    // 48.21 (small hold past "arrived.")
};

async function ensureAssets() {
  const res = await fetch("/transcript.json");
  const data = await res.json();
  // Chapter 1's words: index 106 ("First,") through 215 ("arrived."), inclusive.
  const chapterWords = data.words.slice(106, 216).map((w) => ({
    text: w.text,
    start: w.start - GLOBAL_OFFSET,
    end: w.end - GLOBAL_OFFSET,
  }));
  captionLines = buildCaptionLines(chapterWords, { maxWords: 7 });
}

function pictureBeatSVG({ href, imgW, imgH, t, start, duration, label, camFrom = 1.0, camTo = 1.15, panFromX = 0, panToX = 0, panFromY = 0, panToY = 0 }) {
  const cam = pushPan(t, { start, duration, from: camFrom, to: camTo, fromX: panFromX, toX: panToX, fromY: panFromY, toY: panToY });
  let out = `
    <g class="cam" style="transform:${cam}">
      ${pictureLayerSVG({ href, imgW, imgH, frameW: W, frameH: FRAME_H })}
    </g>
    ${warmGradeOverlayRect(W, FRAME_H)}
    ${vignetteOverlayRect(W, FRAME_H)}
    <rect x="0" y="0" width="${W}" height="${FRAME_H}" filter="url(#filmGrain)" opacity="0.4"/>
  `;
  if (label) {
    const p = fadeIn(t, start + 0.3, 0.5);
    out += `<text x="50%" y="100" text-anchor="middle" font-family="${FONTS.sans}" font-size="22" letter-spacing="3"
      fill="${PALETTE.cream}" opacity="${p.toFixed(3)}">${escapeXML(label)}</text>`;
  }
  return out;
}

function megalaniaSceneSVG(t) {
  const start = BEAT.megalania;
  const local = t - start;
  const enterP = progress(t, start, 1.0, ease.outBack);
  const roarStart = start + 3.4; // lines up with the "creature growl low" cue (~69s global)
  const mouthOpen = clamp01(Math.sin(clamp01((t - roarStart) / 0.6) * Math.PI));
  let out = `
    <rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.outbackNightIndigoDeep}"/>
    <rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.eucalyptusGreenDeep}" opacity="0.22"/>
  `;
  const scale = 3.6 * enterP;
  out += `<g opacity="${enterP.toFixed(3)}">
    ${megalaniaSVG({ x: W / 2 + 260, y: FRAME_H * 0.72, scale, t: local, mouthOpen, tongueFlick: local > 4.2, walking: false, facing: -1 })}
  </g>`;
  const labelP = fadeIn(t, start + 0.3, 0.5);
  out += `<text x="50%" y="100" text-anchor="middle" font-family="${FONTS.sans}" font-size="22" letter-spacing="3"
    fill="${PALETTE.cream}" opacity="${labelP.toFixed(3)}">MEGALANIA</text>`;
  return out;
}

function spiderJokeSVG(t) {
  const start = BEAT.spiderJoke;
  let out = pictureBeatSVG({
    href: "/images/12_huntsman_spider.jpg", imgW: 1280, imgH: 999,
    t, start, duration: BEAT.fossil - start, camFrom: 1.0, camTo: 1.1,
    label: "MEANWHILE, TODAY...",
  });
  // A tiny, deflated Megalania shrinks into the corner for the "downgrade" joke.
  const local = t - start;
  const shrinkP = progress(t, start + 0.4, 1.0, ease.inCubic);
  const miniScale = 0.55 * (1 - shrinkP * 0.6);
  const p = fadeIn(t, start + 0.2, 0.4) * (1 - progress(t, start + 2.6, 0.5, ease.inCubic));
  out += `<g opacity="${clamp01(p).toFixed(3)}">
    ${megalaniaSVG({ x: 220, y: FRAME_H - 60, scale: miniScale, t: local, mouthOpen: 0, tongueFlick: false, walking: false, facing: 1 })}
  </g>`;
  return out;
}

function renderFrame(tLocal) {
  let svg = "";
  if (tLocal < BEAT.gondwana) {
    svg = chapterTitleCardSVG({
      w: W, h: FRAME_H, t: tLocal, start: BEAT.title,
      chapterLabel: "Chapter One",
      title: "The Land That Time Forgot",
    });
  } else if (tLocal < BEAT.diprotodon) {
    svg = pictureBeatSVG({
      href: "/images/08_gondwana_map.jpg", imgW: 1024, imgH: 715,
      t: tLocal, start: BEAT.gondwana, duration: BEAT.diprotodon - BEAT.gondwana,
      camFrom: 1.0, camTo: 1.14, panFromX: 0, panToX: -20,
      label: "GONDWANA · MILLIONS OF YEARS AGO",
    });
  } else if (tLocal < BEAT.procoptodon) {
    svg = pictureBeatSVG({
      href: "/images/09_diprotodon.jpg", imgW: 1024, imgH: 686,
      t: tLocal, start: BEAT.diprotodon, duration: BEAT.procoptodon - BEAT.diprotodon,
      camFrom: 1.0, camTo: 1.16,
      label: "DIPROTODON",
    });
  } else if (tLocal < BEAT.megalania) {
    svg = pictureBeatSVG({
      href: "/images/10_procoptodon.jpg", imgW: 1194, imgH: 1600,
      t: tLocal, start: BEAT.procoptodon, duration: BEAT.megalania - BEAT.procoptodon,
      camFrom: 1.0, camTo: 1.16,
      label: "PROCOPTODON",
    });
  } else if (tLocal < BEAT.spiderJoke) {
    svg = megalaniaSceneSVG(tLocal);
  } else if (tLocal < BEAT.fossil) {
    svg = spiderJokeSVG(tLocal);
  } else {
    const darken = progress(tLocal, BEAT.end - 3.0, 3.0, ease.inCubic) * 0.5;
    svg = pictureBeatSVG({
      href: "/images/13_fossil_excavation.jpg", imgW: 1920, imgH: 1440,
      t: tLocal, start: BEAT.fossil, duration: BEAT.end - BEAT.fossil,
      camFrom: 1.0, camTo: 1.12, panFromX: 0, panToX: 25,
      label: "TENS OF THOUSANDS OF YEARS AGO",
    });
    svg += `<rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="#000" opacity="${darken.toFixed(3)}"/>`;
  }

  if (captionLines) {
    const line = findActiveCaption(captionLines, tLocal);
    if (line) svg += captionBarSVG({ w: W, h: FRAME_H, text: line.text });
  }

  rootEl.innerHTML = svg;
}

window.__ready = ensureAssets();
window.__renderFrame = renderFrame;
window.__END_TIME = BEAT.end;
renderFrame(0);
</script>
</body>
</html>
