<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Opening + Hook</title>
<style>
  @font-face { font-family: "Playfair Display"; src: url("/style/fonts/playfair-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Playfair Display"; src: url("/style/fonts/playfair-display-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Source Sans 3"; src: url("/style/fonts/source-sans-3-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Source Sans 3"; src: url("/style/fonts/source-sans-3-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  html, body { margin: 0; padding: 0; background: #000; }
  svg { display: block; }
  .cam { transform-origin: 50% 50%; }
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs"></defs>
  <g id="root"></g>
</svg>

<script type="module">
import { PALETTE, FONTS, ease, progress, fadeIn, clamp01, styleDefsSVG, vignetteOverlayRect,
         warmGradeOverlayRect, pushPan, pan, pushIn, starsSVG, pictureLayerSVG,
         buildCaptionLines, findActiveCaption, captionBarSVG, wordRevealSpans, escapeXML } from "/style/style.js";
import { emuSVG, soldierSilhouetteSVG, machineGunSVG, wheatFieldSVG, campfireSVG,
         iconLizardSVG, iconShipSVG, iconGoldNuggetSVG, iconOperaHouseSVG } from "/style/characters.js";
import { loadCoastline, mapRevealSVG, coastlinePathD, projectLonLat, PLACES } from "/style/maps.js";

const W = 1920, FRAME_H = 1080;
const defsEl = document.getElementById("defs");
const rootEl = document.getElementById("root");
defsEl.innerHTML = styleDefsSVG();

let coastline = null;
let captionLines = null;

// ---- Timeline ----
const CARD1_START = 0.0, CARD1_DUR = 8.0;
const CARD2_START = 8.0, CARD2_DUR = 5.0;
const HOOK_OFFSET = 13.0; // opening cards total length; hook-local time + this = global time

// Hook-local beat boundaries (seconds, matching transcript.json word timings)
const BEAT = {
  fieldStart: 0.0,
  emuCut: 4.11,       // "against" — cut to emu close-up
  scatter: 5.11,      // "and the birds won." — emus scatter
  montage1: 6.56,     // prison hulks — "a country that began...as a prison"
  montage2: 11.5,     // Bligh portrait — "soldiers overthrew a governor...mutiny"
  montage3: 15.95,    // rough surf — "prime minister went for a swim...never seen again"
  montage4: 19.6,     // night sky + campfire — "people have lived...oldest continuing cultures"
  mapFill: 27.63,     // "Today, we're covering ALL of it..."
  uluru: 37.09,       // "the one question Australia still hasn't answered"
  titleCard: 40.15,   // "Let's go."
  end: 41.13,
};

const END_TIME = HOOK_OFFSET + BEAT.end;

async function ensureAssets() {
  coastline = await loadCoastline();
  const res = await fetch("/transcript.json");
  const data = await res.json();
  // Only the hook's words (through "Let's go.") — index 0..105 inclusive.
  const hookWords = data.words.slice(0, 106);
  captionLines = buildCaptionLines(hookWords, { maxWords: 7 });
}

// ---- Opening cards ----
function openingCardBackdrop(t) {
  const camScale = pushIn(t, { start: 0, duration: CARD1_DUR + CARD2_DUR, from: 1.0, to: 1.08 });
  return `
    <rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.outbackNightIndigoDeep}"/>
    <g class="cam" style="transform:${camScale}">
      <rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.outbackNightIndigo}" opacity="0.5"/>
      ${starsSVG({ w: W, h: FRAME_H, t, count: 160, seed: 11, driftPxPerSec: 3, maxY: FRAME_H * 0.75 })}
      <path d="M -50 ${FRAME_H * 0.78} Q ${W * 0.25} ${FRAME_H * 0.7}, ${W * 0.5} ${FRAME_H * 0.76} T ${W + 50} ${FRAME_H * 0.74} V ${FRAME_H} H -50 Z"
        fill="${PALETTE.outbackNightIndigoDeep}"/>
    </g>
  `;
}

function card1SVG(t) {
  const lines = [
    "Long before this land had a name on any map,",
    "it was known, sung, and cared for.",
    "",
    "We acknowledge the Traditional Custodians of Country throughout Australia",
    "and their continuing connection to land, sea and sky.",
    "We pay our respects to Elders past and present.",
  ];
  let out = openingCardBackdrop(t);
  const blockStart = CARD1_START + 0.6;
  const lineGap = 0.55;
  const visibleLines = lines.filter((l) => l.length > 0);
  let y = FRAME_H / 2 - (visibleLines.length * 42) / 2;
  let li = 0;
  for (const line of lines) {
    if (line.length === 0) { y += 24; continue; }
    const p = fadeIn(t, blockStart + li * lineGap, 0.8);
    out += `<text x="50%" y="${y}" text-anchor="middle" font-family="${FONTS.serif}" font-size="30"
      fill="${PALETTE.cream}" opacity="${p.toFixed(3)}">${escapeXML(line)}</text>`;
    y += 42;
    li++;
  }
  return out;
}

function card2SVG(t) {
  const lines = [
    "Aboriginal and Torres Strait Islander viewers are advised",
    "that this film contains images and names of people who have died.",
  ];
  let out = openingCardBackdrop(t);
  const blockStart = CARD2_START + 0.4;
  const lineGap = 0.6;
  let y = FRAME_H / 2 - (lines.length * 42) / 2;
  lines.forEach((line, i) => {
    const p = fadeIn(t, blockStart + i * lineGap, 0.8);
    out += `<text x="50%" y="${y}" text-anchor="middle" font-family="${FONTS.serif}" font-size="28"
      fill="${PALETTE.cream}" opacity="${p.toFixed(3)}">${escapeXML(line)}</text>`;
    y += 42;
  });
  return out;
}

// ---- Hook beats ----
function fieldSoldiersSVG(ht) {
  let out = wheatFieldSVG({ w: W, h: FRAME_H });
  const shake = Math.sin(ht * 30) * (ht > 2.8 ? 3 : 0); // camera rattles as the burst approaches
  out = `<g transform="translate(${shake},0)">${out}</g>`;
  out += machineGunSVG({ x: W * 0.5, y: FRAME_H * 0.72, scale: 2.4 });
  out += soldierSilhouetteSVG({ x: W * 0.5 - 120, y: FRAME_H * 0.74, scale: 2.6, armAngle: -35, legAngle: 6 });
  out += soldierSilhouetteSVG({ x: W * 0.5 + 130, y: FRAME_H * 0.75, scale: 2.6, armAngle: -15, legAngle: -4 });
  const labelP = fadeIn(ht, 0.3, 0.6);
  out += `<text x="50%" y="120" text-anchor="middle" font-family="${FONTS.sans}" font-size="22" letter-spacing="4"
    fill="${PALETTE.cream}" opacity="${labelP.toFixed(3)}">AUSTRALIA &middot; 1932</text>`;
  return out;
}

function emuCutSVG(ht) {
  const p = fadeIn(ht, BEAT.emuCut, 0.15);
  return `
    <rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.outbackNightIndigoDeep}"/>
    <rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.redOchreDeep}" opacity="0.25"/>
    <g opacity="${p.toFixed(3)}">
      ${emuSVG({ x: W / 2 - 20, y: FRAME_H * 0.86, scale: 5.2, t: ht, walking: false, blinking: true, neckBend: -0.05, mood: 0.6 })}
    </g>
  `;
}

function scatterSVG(ht) {
  const local = ht - BEAT.scatter;
  const dust = clamp01(local / 1.2);
  let out = `<rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.redOchreDeep}"/>`;
  const positions = [-0.3, -0.1, 0.15, 0.35, 0.55, 0.75, 1.0, 1.2];
  positions.forEach((offset, i) => {
    const dir = i % 2 === 0 ? 1 : -1;
    const speed = 260 + (i % 3) * 40;
    const ex = W * 0.5 + offset * W * 0.5 + dir * local * speed;
    out += emuSVG({ x: ex, y: FRAME_H * 0.82 + (i % 3) * 14, scale: 1.4 - (i % 3) * 0.15, t: ht + i, walking: true, blinking: false, neckBend: 0.2, mood: 0.2 });
  });
  out += `<ellipse cx="${W / 2}" cy="${FRAME_H * 0.9}" rx="${300 + dust * 500}" ry="${60 + dust * 40}"
    fill="${PALETTE.sandstone}" opacity="${(0.35 * dust).toFixed(2)}"/>`;
  return out;
}

function montageImageSVG({ href, imgW, imgH, ht, start, duration, camFrom = 1.0, camTo = 1.16, panFromX = 0, panToX = 0, label }) {
  const cam = pushPan(ht, { start, duration, from: camFrom, to: camTo, fromX: panFromX, toX: panToX });
  let out = `
    <g class="cam" style="transform:${cam}">
      ${pictureLayerSVG({ href, imgW, imgH, frameW: W, frameH: FRAME_H })}
    </g>
    ${warmGradeOverlayRect(W, FRAME_H)}
    ${vignetteOverlayRect(W, FRAME_H)}
    <rect x="0" y="0" width="${W}" height="${FRAME_H}" filter="url(#filmGrain)" opacity="0.4"/>
  `;
  if (label) {
    const p = fadeIn(ht, start + 0.3, 0.5);
    out += `<text x="60" y="${FRAME_H - 56}" font-family="${FONTS.sans}" font-size="22" letter-spacing="3"
      fill="${PALETTE.cream}" opacity="${p.toFixed(3)}">${escapeXML(label)}</text>`;
  }
  return out;
}

function nightCampfireSVG(ht) {
  const start = BEAT.montage4;
  let out = `<rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.outbackNightIndigoDeep}"/>`;
  out += starsSVG({ w: W, h: FRAME_H, t: ht, count: 200, seed: 77, driftPxPerSec: 1.5, maxY: FRAME_H * 0.7 });
  out += `<path d="M -50 ${FRAME_H * 0.72} Q ${W * 0.3} ${FRAME_H * 0.66}, ${W * 0.55} ${FRAME_H * 0.7} T ${W + 50} ${FRAME_H * 0.68} V ${FRAME_H} H -50 Z"
    fill="${PALETTE.outbackNightIndigo}"/>`;
  const glow = 0.5 + 0.5 * Math.sin(ht * 6);
  out += `<circle cx="${W / 2}" cy="${FRAME_H * 0.82}" r="${140 + glow * 12}" fill="${PALETTE.sunsetOrange}" opacity="0.12"/>`;
  out += campfireSVG({ x: W / 2, y: FRAME_H * 0.86, scale: 3.2, t: ht });
  const p = fadeIn(ht, start + 0.4, 0.6);
  out += `<text x="50%" y="120" text-anchor="middle" font-family="${FONTS.sans}" font-size="22" letter-spacing="4"
    fill="${PALETTE.cream}" opacity="${p.toFixed(3)}">50,000+ YEARS</text>`;
  return out;
}

const MAP_ICONS = [
  { key: "lizard", lon: 131, lat: -23, at: 1.4, draw: iconLizardSVG, scale: 2.4 },
  { key: "ship", lon: 151.2, lat: -34.0, at: 3.0, draw: iconShipSVG, scale: 2.2 },
  { key: "nugget", lon: 143.8, lat: -37.5, at: 4.6, draw: iconGoldNuggetSVG, scale: 2.2 },
  { key: "opera", lon: 151.3, lat: -33.8, at: 6.2, draw: iconOperaHouseSVG, scale: 1.8 },
  { key: "emu", lon: 135, lat: -29, at: 7.8, draw: null, scale: 1.6 },
];

function mapFillSVG(ht) {
  const start = BEAT.mapFill;
  const local = ht - start;
  let out = `<rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.outbackNightIndigoDeep}"/>`;
  const scale = 1.55;
  const mapW = coastline.width * scale;
  const mapH = coastline.height * scale;
  const ox = (W - mapW) / 2;
  const oy = (FRAME_H - mapH) / 2 + 30;
  out += `<g transform="translate(${ox},${oy}) scale(${scale})">`;
  out += mapRevealSVG({ coastline, t: ht, start, drawDuration: 1.5 });
  for (const icon of MAP_ICONS) {
    const [mx, my] = projectLonLat(coastline, icon.lon, icon.lat);
    const p = progress(ht, start + icon.at, 0.5, ease.outBack);
    if (p <= 0) continue;
    const bob = Math.sin((ht - (start + icon.at)) * 3) * 3;
    out += `<g transform="translate(${mx},${my + bob}) scale(${(icon.scale * p).toFixed(3)})" opacity="${clamp01(p * 1.4).toFixed(3)}">`;
    out += icon.draw ? icon.draw({ x: 0, y: 0, scale: 1 }) : emuSVG({ x: -8, y: 14, scale: 0.5, t: ht, walking: false, blinking: true, neckBend: 0.1, mood: 0.5 });
    out += `</g>`;
  }
  out += `</g>`;
  const labelP = fadeIn(ht, start + 0.1, 0.5);
  out += `<text x="50%" y="80" text-anchor="middle" font-family="${FONTS.sans}" font-size="24" letter-spacing="5"
    fill="${PALETTE.cream}" opacity="${labelP.toFixed(3)}">AUSTRALIA</text>`;
  return out;
}

function uluruQuestionSVG(ht) {
  const start = BEAT.uluru;
  const cam = pushIn(ht, { start, duration: BEAT.titleCard - start, from: 1.0, to: 1.1 });
  let out = `
    <g class="cam" style="transform:${cam}">
      ${pictureLayerSVG({ href: "/images/07_uluru_sunset.jpg", imgW: 1280, imgH: 854, frameW: W, frameH: FRAME_H })}
    </g>
    ${warmGradeOverlayRect(W, FRAME_H)}
    ${vignetteOverlayRect(W, FRAME_H)}
    <rect x="0" y="0" width="${W}" height="${FRAME_H}" filter="url(#filmGrain)" opacity="0.4"/>
  `;
  const qP = fadeIn(ht, start + 0.4, 0.7);
  const glow = 0.6 + 0.4 * Math.sin(ht * 3.2);
  out += `<text x="50%" y="${FRAME_H * 0.4}" text-anchor="middle" font-family="${FONTS.serif}" font-size="140"
    fill="${PALETTE.sandstoneLight}" opacity="${(qP * glow).toFixed(3)}" filter="url(#softGlow)">?</text>`;
  return out;
}

function titleCardSVG(ht) {
  const start = BEAT.titleCard;
  const bgP = fadeIn(ht, start, 0.2);
  let out = `<rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.outbackNightIndigoDeep}" opacity="${bgP.toFixed(3)}"/>`;
  out += starsSVG({ w: W, h: FRAME_H, t: ht, count: 120, seed: 5, driftPxPerSec: 2, maxY: FRAME_H });
  const titleP = progress(ht, start + 0.1, 0.5, ease.outBack);
  const underlineP = progress(ht, start + 0.45, 0.4, ease.outCubic);
  out += `<text x="50%" y="${FRAME_H / 2 - 10}" text-anchor="middle" font-family="${FONTS.serif}" font-weight="700"
    font-size="92" fill="${PALETTE.cream}" opacity="${titleP.toFixed(3)}"
    transform="translate(0, ${(1 - titleP) * 20})">THE ENTIRE HISTORY</text>`;
  out += `<text x="50%" y="${FRAME_H / 2 + 90}" text-anchor="middle" font-family="${FONTS.serif}" font-weight="700"
    font-size="92" fill="${PALETTE.sunsetOrange}" opacity="${titleP.toFixed(3)}"
    transform="translate(0, ${(1 - titleP) * 20})">OF AUSTRALIA</text>`;
  const underlineWidth = 420 * underlineP;
  out += `<rect x="${W / 2 - underlineWidth / 2}" y="${FRAME_H / 2 + 130}" width="${underlineWidth}" height="4" fill="${PALETTE.redOchre}"/>`;
  const emuP = fadeIn(ht, start + 0.3, 0.4);
  out += `<g opacity="${emuP.toFixed(3)}">${emuSVG({ x: W - 70, y: FRAME_H - 40, scale: 2.2, t: ht, walking: false, blinking: true, neckBend: -0.3, mood: 0.9 })}</g>`;
  return out;
}

function renderFrame(tGlobal) {
  let svg = "";
  if (tGlobal < CARD1_DUR) {
    svg = card1SVG(tGlobal);
  } else if (tGlobal < CARD1_DUR + CARD2_DUR) {
    svg = card2SVG(tGlobal);
  } else {
    const ht = tGlobal - HOOK_OFFSET;
    if (ht < BEAT.emuCut) svg = fieldSoldiersSVG(ht);
    else if (ht < BEAT.scatter) svg = emuCutSVG(ht);
    else if (ht < BEAT.montage1) svg = scatterSVG(ht);
    else if (ht < BEAT.montage2) svg = montageImageSVG({ href: "/images/02_convict_ship_painting.jpg", imgW: 1920, imgH: 874, ht, start: BEAT.montage1, duration: BEAT.montage2 - BEAT.montage1, panFromX: 0, panToX: -20, label: "A PRISON AT THE END OF THE WORLD" });
    else if (ht < BEAT.montage3) svg = montageImageSVG({ href: "/images/03_william_bligh_portrait.jpg", imgW: 759, imgH: 953, ht, start: BEAT.montage2, duration: BEAT.montage3 - BEAT.montage2, camFrom: 1.0, camTo: 1.1, label: "WILLIAM BLIGH" });
    else if (ht < BEAT.montage4) svg = montageImageSVG({ href: "/images/04_rough_surf_beach.jpg", imgW: 1920, imgH: 1372, ht, start: BEAT.montage3, duration: BEAT.montage4 - BEAT.montage3, panFromX: 0, panToX: 30 });
    else if (ht < BEAT.mapFill) svg = nightCampfireSVG(ht);
    else if (ht < BEAT.uluru) svg = coastline ? mapFillSVG(ht) : "";
    else if (ht < BEAT.titleCard) svg = uluruQuestionSVG(ht);
    else svg = titleCardSVG(ht);

    // Subtitles over the hook only (never over opening cards or the title card beat).
    if (captionLines && ht < BEAT.titleCard) {
      const line = findActiveCaption(captionLines, ht);
      if (line) svg += captionBarSVG({ w: W, h: FRAME_H, text: line.text });
    }
  }
  rootEl.innerHTML = svg;
}

window.__ready = ensureAssets();
window.__renderFrame = renderFrame;
window.__END_TIME = END_TIME;
renderFrame(0);
</script>
</body>
</html>
