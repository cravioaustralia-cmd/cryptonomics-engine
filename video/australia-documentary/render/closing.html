<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Closing</title>
<style>
  @font-face { font-family: "Playfair Display"; src: url("/style/fonts/playfair-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Playfair Display"; src: url("/style/fonts/playfair-display-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Source Sans 3"; src: url("/style/fonts/source-sans-3-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Source Sans 3"; src: url("/style/fonts/source-sans-3-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  html, body { margin: 0; padding: 0; background: #000; }
  svg { display: block; }
  .cam { transform-origin: 50% 50%; }
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs"></defs>
  <g id="root"></g>
</svg>

<script type="module">
import { PALETTE, FONTS, ease, progress, fadeIn, styleDefsSVG, vignetteOverlayRect,
         warmGradeOverlayRect, pushIn, pictureLayerSVG, escapeXML } from "/style/style.js";
import { emuSVG, blinkAmount } from "/style/characters.js";

const W = 1920, FRAME_H = 1080;
const defsEl = document.getElementById("defs");
const rootEl = document.getElementById("root");
defsEl.innerHTML = styleDefsSVG();

// Closing cards (PROMPT.md Step 8) — silent text cards after the last
// spoken line, no transcript/subtitles. Card 3 over a darkened Uluru
// dusk, then the end screen with the emu's last blink and an animated
// like / subscribe / notifications call-to-action, right side of frame
// kept clear for YouTube's own end-screen elements.
const BEAT = {
  noteCard: 0.0,
  endScreen: 9.0,
  end: 24.0,
};

function noteCardSVG(t) {
  const start = BEAT.noteCard;
  const cam = pushIn(t, { start, duration: BEAT.end, from: 1.0, to: 1.08, easeFn: ease.linear });
  let out = `
    <g class="cam" style="transform:${cam}">
      ${pictureLayerSVG({ href: "/images/90_uluru_sunset_wide.jpg", imgW: 1280, imgH: 854, frameW: W, frameH: FRAME_H })}
    </g>
    <rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="${PALETTE.ink}" opacity="0.72"/>
    ${warmGradeOverlayRect(W, FRAME_H)}
    ${vignetteOverlayRect(W, FRAME_H)}
  `;

  const lines = [
    "This film is drawn from historical records and the best research available to us.",
    "History is vast, and new evidence is still coming to light.",
    "If we've got anything wrong, it was never our intention.",
    "Tell us in the comments, and we'll keep learning together.",
  ];
  const headingP = fadeIn(t, start + 0.3, 0.7);
  out += `<text x="50%" y="330" text-anchor="middle" font-family="${FONTS.serif}" font-weight="700" font-size="46"
    fill="${PALETTE.cream}" opacity="${headingP.toFixed(3)}">A note on this story</text>`;
  lines.forEach((line, i) => {
    const lp = fadeIn(t, start + 1.1 + i * 1.15, 0.7);
    out += `<text x="50%" y="${450 + i * 60}" text-anchor="middle" font-family="${FONTS.sans}" font-size="26"
      fill="${PALETTE.sandstoneLight}" opacity="${lp.toFixed(3)}">${escapeXML(line)}</text>`;
  });

  return out;
}

// ---- Animated call-to-action icons (flat 2D, matching the style kit) ----
function thumbsUpSVG(x, y, scale, t, popStart) {
  const popP = progress(t, popStart, 0.4, ease.outBack);
  const idle = 1 + 0.06 * Math.sin((t - popStart) * 2.2);
  const s = scale * popP * idle;
  return `
    <g transform="translate(${x},${y}) scale(${s.toFixed(3)})" opacity="${progress(t, popStart, 0.3, ease.linear).toFixed(3)}">
      <path d="M -22 10 L -22 44 L -34 44 L -34 10 Z" fill="${PALETTE.sandstone}"/>
      <path d="M -20 10 L -6 -30 C -3 -36 6 -34 5 -26 L 1 -6 L 26 -6 C 33 -6 37 0 34 7 L 24 38 C 22 42 18 44 14 44 L -20 44 Z"
        fill="${PALETTE.sunsetOrange}"/>
    </g>
  `;
}

function bellSVG(x, y, scale, t, ringStart) {
  const appearP = progress(t, ringStart, 0.3, ease.outBack);
  const ringPhase = (t - ringStart) % 2.2;
  const ring = ringPhase < 0.6 ? Math.sin(ringPhase * 24) * 10 * (1 - ringPhase / 0.6) : 0;
  return `
    <g transform="translate(${x},${y}) scale(${(scale * appearP).toFixed(3)}) rotate(${ring.toFixed(2)})"
       opacity="${progress(t, ringStart, 0.3, ease.linear).toFixed(3)}">
      <path d="M 0 -34 C -16 -34 -22 -22 -22 -8 L -22 10 L -30 24 L 30 24 L 22 10 L 22 -8 C 22 -22 16 -34 0 -34 Z" fill="${PALETTE.sandstone}"/>
      <circle cx="0" cy="34" r="7" fill="${PALETTE.sandstone}"/>
    </g>
  `;
}

function subscribeButtonSVG(x, y, t, appearStart) {
  const appearP = progress(t, appearStart, 0.35, ease.outBack);
  const pulse = 1 + 0.05 * Math.max(0, Math.sin((t - appearStart) * 2.4));
  return `
    <g transform="translate(${x},${y}) scale(${(appearP * pulse).toFixed(3)})" opacity="${progress(t, appearStart, 0.3, ease.linear).toFixed(3)}">
      <rect x="-110" y="-34" width="220" height="68" rx="10" fill="${PALETTE.redOchre}"/>
      <text x="0" y="10" text-anchor="middle" font-family="${FONTS.sans}" font-weight="600" font-size="30" letter-spacing="1"
        fill="${PALETTE.cream}">SUBSCRIBE</text>
    </g>
  `;
}

function endScreenSVG(t) {
  const start = BEAT.endScreen;
  const local = t - start;
  let out = `
    <g class="cam">
      ${pictureLayerSVG({ href: "/images/94_end_screen_blank.jpg", imgW: 1920, imgH: 1080, frameW: W, frameH: FRAME_H })}
    </g>
    ${warmGradeOverlayRect(W, FRAME_H)}
    ${vignetteOverlayRect(W, FRAME_H)}
  `;
  // Right ~38% of frame stays clear for YouTube's own end-screen elements.
  const safeRightX = W * 0.62;

  const titleP = fadeIn(t, start + 0.2, 0.6);
  out += `<text x="${safeRightX / 2}" y="200" text-anchor="middle" font-family="${FONTS.serif}" font-weight="700" font-size="58"
    fill="${PALETTE.cream}" opacity="${titleP.toFixed(3)}">Thanks for watching</text>`;

  const rowY = 480;
  out += thumbsUpSVG(safeRightX * 0.22, rowY, 1.4, t, start + 1.0);
  out += `<text x="${safeRightX * 0.22}" y="${rowY + 90}" text-anchor="middle" font-family="${FONTS.sans}" font-size="20"
    fill="${PALETTE.sandstoneLight}" opacity="${fadeIn(t, start + 1.2, 0.4).toFixed(3)}">Like this video</text>`;

  out += subscribeButtonSVG(safeRightX * 0.5, rowY, t, start + 1.6);
  out += `<text x="${safeRightX * 0.5}" y="${rowY + 90}" text-anchor="middle" font-family="${FONTS.sans}" font-size="20"
    fill="${PALETTE.sandstoneLight}" opacity="${fadeIn(t, start + 1.8, 0.4).toFixed(3)}">Subscribe for more</text>`;

  out += bellSVG(safeRightX * 0.78, rowY, 1.3, t, start + 2.2);
  out += `<text x="${safeRightX * 0.78}" y="${rowY + 90}" text-anchor="middle" font-family="${FONTS.sans}" font-size="20"
    fill="${PALETTE.sandstoneLight}" opacity="${fadeIn(t, start + 2.4, 0.4).toFixed(3)}">Turn on notifications</text>`;

  // The emu mascot, blinking in the lower corner — its last appearance.
  const blink = blinkAmount(t, 3.4, 0.12);
  out += emuSVG({ x: 110, y: FRAME_H + 20, scale: 1.8, t, walking: false, blinking: true, neckBend: 0.1, mood: 0.6 });

  // Fade to black over the last 3 seconds of the video.
  const fadeOutP = progress(t, BEAT.end - 3.0, 3.0, ease.inCubic);
  out += `<rect x="0" y="0" width="${W}" height="${FRAME_H}" fill="#000" opacity="${fadeOutP.toFixed(3)}"/>`;

  return out;
}

function renderFrame(tLocal) {
  let svg = "";
  if (tLocal < BEAT.endScreen) {
    svg = noteCardSVG(tLocal);
  } else {
    svg = endScreenSVG(tLocal);
  }
  rootEl.innerHTML = svg;
}

window.__ready = Promise.resolve();
window.__renderFrame = renderFrame;
window.__END_TIME = BEAT.end;
renderFrame(0);
</script>
</body>
</html>
